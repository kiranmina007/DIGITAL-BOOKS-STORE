<style>
  :root {
    --bg: #0f1729;
    --card: #1c2436;
    --border: #2e3850;
    --text: #ffffff;
    --muted: #9aa3b5;
    --accent: #22c55e;
    --btn-from: #5b6cf0;
    --btn-to: #0ab4d6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Inter", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    min-height: 100vh;
    min-height: 100dvh;
  }
  .card {
    width: 100%;
    max-width: 440px;
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 32px;
    padding: 40px 24px 36px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,.35);
  }
  /* ===== Animated logo hero ===== */
  .hero {
    display: flex; align-items: center; justify-content: center;
    gap: 12px;
    margin: 0 auto 26px;
  }
  .logo-wrap { position: relative; width: 148px; height: 148px; flex: none; }
  .logo {
    position: relative; z-index: 2;
    width: 100%; height: 100%;
    border-radius: 50%;
    border: 4px solid #fff;
    overflow: hidden;
    background: #000;
    animation: breathe 3.2s ease-in-out infinite;
  }
  .logo img { width: 100%; height: 100%; object-fit: cover; transform: scale(1.1); display: block; }

  /* rotating gold + green ring */
  .ring {
    position: absolute; z-index: 1; inset: -9px; border-radius: 50%;
    background: conic-gradient(from 0deg, #f5c542, rgba(245,197,66,0) 30%, #22c55e 55%, rgba(34,197,94,0) 80%, #f5c542);
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px));
            mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px));
    animation: spin 4s linear infinite;
  }
  /* green pulse waves */
  .pulse {
    position: absolute; z-index: 0; inset: 0; border-radius: 50%;
    border: 2px solid rgba(34,197,94,.7);
    animation: ripple 3s ease-out infinite;
  }
  .pulse.p2 { animation-delay: 1.5s; }

  /* live candlesticks on both sides */
  .candles { display: flex; align-items: flex-end; gap: 5px; height: 96px; width: 44px; flex: none; }
  .c {
    position: relative; width: 7px; height: var(--h);
    color: #22c55e;
    transform-origin: bottom center;
    animation: grow var(--t) ease-in-out var(--d) infinite;
  }
  .c::before { content: ""; position: absolute; left: 50%; top: -9px; bottom: -7px; width: 2px; margin-left: -1px; background: currentColor; }
  .c::after  { content: ""; position: absolute; inset: 0; background: currentColor; border-radius: 2px; }
  .c.red   { color: #ef4444; }
  .c.flip  { animation: grow var(--t) ease-in-out var(--d) infinite, flip calc(var(--t) * 2) steps(1) var(--d) infinite; }

  @keyframes spin    { to { transform: rotate(360deg); } }
  @keyframes breathe { 0%,100% { box-shadow: 0 0 14px rgba(245,197,66,.25); } 50% { box-shadow: 0 0 30px rgba(34,197,94,.55); } }
  @keyframes ripple  { 0% { transform: scale(1); opacity: .8; } 100% { transform: scale(1.55); opacity: 0; } }
  @keyframes grow    { 0%,100% { transform: scaleY(1); } 35% { transform: scaleY(1.45); } 70% { transform: scaleY(.7); } }
  @keyframes flip    { 0% { color: #22c55e; } 50% { color: #ef4444; } }

  @media (prefers-reduced-motion: reduce) {
    .logo, .ring, .pulse, .c { animation: none !important; }
    .pulse { display: none; }
  }
  h1 { font-size: 2.4rem; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 18px; }
  .lines p { font-size: 1.1rem; line-height: 1.6; color: #e7ebf3; }
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 14px;
    width: 100%;
    margin-top: 30px;
    padding: 17px 20px;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--btn-from), var(--btn-to));
    color: #fff; text-decoration: none;
    font-size: 1.3rem; font-weight: 700;
    box-shadow: 0 8px 24px rgba(10,180,214,.25);
    transition: transform .15s ease;
  }
  .btn:active { transform: scale(.98); }
  .btn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  .btn svg { width: 30px; height: 30px; flex: none; }
  .redirect { margin-top: 22px; font-size: 1.05rem; color: var(--muted); min-height: 1.5em; }
  .foot { max-width: 440px; margin-top: 28px; text-align: center; color: var(--muted); font-size: .9rem; line-height: 1.7; }
  .foot b { color: var(--accent); font-weight: 700; font-size: 1.05rem; }
  @media (max-width: 380px) {
    h1 { font-size: 2rem; }
    .lines p { font-size: 1rem; }
    .btn { font-size: 1.15rem; }
  }
</style>
